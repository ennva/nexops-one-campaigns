# Mirrors the Netlify setup in netlify.toml for local use.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Keep the host port in redirects such as /fr -> /fr/.
    absolute_redirect off;
    charset utf-8;
    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    error_page 404 /404.html;

    # Netlify Forms posts to "/". Locally there is no form backend, so accept the POST
    # and let the page continue to the thank-you page. Submissions are not stored.
    location = / {
        if ($request_method = POST) {
            return 200 "ok";
        }
        try_files /index.html =404;
    }

    location /fr/ {
        error_page 404 /fr/404.html;
        try_files $uri $uri/ =404;
    }

    location /assets/fonts/ {
        # add_header in a location replaces the server-level headers, so include them again.
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
